[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cachealign"
version = "0.1.0"
description = "Autonomous prompt cache optimizer & prefix alignment middleware for AI agents (Anthropic, OpenAI, Gemini)"
readme = "README.md"
authors = [
    { name = "Vinay Kumar Ksheera Sagar", email = "sagarv.kumar48@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "click>=8.1.0",
    "pydantic>=2.5.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
anthropic = [
    "anthropic>=0.30.0",
]
openai = [
    "openai>=1.30.0",
]
gemini = [
    "google-genai>=0.1.0",
]
all = [
    "anthropic>=0.30.0",
    "openai>=1.30.0",
    "google-genai>=0.1.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "anthropic>=0.30.0",
    "openai>=1.30.0",
    "google-genai>=0.1.0",
]

[project.scripts]
cachealign = "cachealign.cli.main:cli"

[project.urls]
Homepage = "https://github.com/sagarv48/cachealign"
Documentation = "https://github.com/sagarv48/cachealign#readme"
Repository = "https://github.com/sagarv48/cachealign.git"
Issues = "https://github.com/sagarv48/cachealign/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/cachealign"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"