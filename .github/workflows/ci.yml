name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python-test:
    name: Python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync --all-extras --dev

    - name: Run Ruff Lint & Format Check
      run: |
        uv run ruff check .
        uv run ruff format --check .

    - name: Run Pytest
      run: uv run pytest --cov=src/cachealign --cov-report=term-missing

    - name: Test Wheel & Sdist Build
      run: uv build

  rust-proxy:
    name: Rust Sidecar Proxy
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cargo Check
      run: |
        cd crates/cachealign-proxy
        cargo check --verbose

    - name: Build Docker Container
      run: |
        docker build -t cachealign-proxy:ci crates/cachealign-proxy
  hermetic-smoke-test:
    name: Hermetic KV-Cache Verification (Docker Compose)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Run Docker Compose KV-Cache Verification
      run: |
        docker compose -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from smoke-test

