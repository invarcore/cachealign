name: Live Provider Evaluation

on:
  schedule:
    - cron: '0 2 * * *'  # 02:00 UTC nightly
  workflow_dispatch:
    inputs:
      workload:
        description: 'Benchmark workload to evaluate'
        required: false
        default: 'data_agent'
        type: choice
        options:
          - data_agent
          - rotating_rag
          - coding_loop
          - all
      turns:
        description: 'Number of turns per workload'
        required: false
        default: '2'
        type: string
  push:
    branches: [ main ]
    paths:
      - 'src/cachealign/**'
      - 'benchmarks/**'
      - '.github/workflows/live-eval.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/cachealign/**'
      - 'benchmarks/**'
      - '.github/workflows/live-eval.yml'

jobs:
  nvidia-nim-live-eval:
    name: NVIDIA NIM Live Prefix Cache Verification
    runs-on: ubuntu-latest
    # Guardrail 1: Safely skip for external fork PRs without failing the build or leaking secrets
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
      LLM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Secret Availability
        id: check-secret
        run: |
          if [ -z "${{ secrets.NVIDIA_NIM_API_KEY }}" ]; then
            echo "::notice ::NVIDIA_NIM_API_KEY secret is not configured in this repository. Skipping live evaluation."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Install uv
        if: steps.check-secret.outputs.skip == 'false'
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        if: steps.check-secret.outputs.skip == 'false'
        run: uv python install 3.12

      - name: Install dependencies
        if: steps.check-secret.outputs.skip == 'false'
        run: uv sync --all-extras --dev

      # Guardrail 2 (Fast Smoke Test): Consumes <1500 tokens in ~2 seconds on every trigger
      - name: Run Live Smoke Probe
        if: steps.check-secret.outputs.skip == 'false'
        run: |
          mkdir -p benchmarks/results
          uv run python -m cachealign.cache_probe_runner \
            --route-name nvidia-nim-direct \
            --base-url https://integrate.api.nvidia.com \
            --api-format openai \
            --model nvidia/nemotron-3-ultra-550b-a55b \
            --tokens 1500 \
            --mode daily-smoke \
            --output-jsonl benchmarks/results/live_probe_summary.jsonl

      # Guardrail 3: Assert physical caching invariants (Turn 2 cached_tokens > 0 and CTR >= 70%)
      - name: Assert Physical Caching Invariants (Zero-Defect Verification)
        if: steps.check-secret.outputs.skip == 'false'
        run: |
          uv run python benchmarks/verify_live_eval_invariants.py benchmarks/results/live_probe_summary.jsonl

      # Guardrail 2 (Multi-Arm Benchmark): Runs ONLY on nightly cron or manual workflow dispatch
      - name: Run Multi-Arm Benchmark (Nightly / Manual Dispatch Only)
        if: steps.check-secret.outputs.skip == 'false' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          WORKLOAD="${{ github.event.inputs.workload || 'data_agent' }}"
          TURNS="${{ github.event.inputs.turns || '2' }}"
          uv run python benchmarks/run_3arm_benchmark.py \
            --backend live \
            --live-provider nvidia_nim \
            --workload "$WORKLOAD" \
            --turns "$TURNS" \
            --output-dir benchmarks/results

      - name: Upload Evaluation Artifacts
        if: steps.check-secret.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: nvidia-nim-live-eval-artifacts
          path: |
            benchmarks/results/live_probe_summary.jsonl
            benchmarks/results/3arm_benchmark_results.json
            benchmarks/results/3arm_benchmark_logs.jsonl
          if-no-files-found: ignore

  observatory-multi-provider-smoke:
    name: Multi-Provider Cache Observatory Daily Smoke
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run Multi-Provider Smoke Probes
        run: |
          uv run python observatory/run_daily_observatory.py --mode daily-smoke --output-jsonl observatory/cache_probe_history.jsonl

      - name: Upload Observatory History
        uses: actions/upload-artifact@v4
        with:
          name: cache-probe-history
          path: observatory/cache_probe_history.jsonl
          if-no-files-found: ignore

